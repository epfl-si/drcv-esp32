version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    container_name: tpi-backend
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./CrowPanel:/app/CrowPanel
      - ./src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    container_name: tpi-frontend
